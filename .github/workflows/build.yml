name: Build extension

on:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  package:
    name: Build extension
    needs: test
    runs-on: ubuntu-24.04
    # Artifact upload works with the repo's read-only default token (verified
    # in CI). Re-grant actions: write only if an upload ever fails.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # vsce triggers the `vscode:prepublish` hook, which runs
      # check-types + lint + esbuild --production.
      - name: Package extension
        run: npx --no-install @vscode/vsce package --no-dependencies

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gdscript-test-runner-vsix
          path: '*.vsix'
          if-no-files-found: error
