name: Build extension

on:
  workflow_run:
    workflows: [Unit tests]
    types: [completed]

concurrency:
  group: build-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  package:
    name: Build extension
    # Only build after a successful Unit tests run that was triggered by a
    # push (or manual dispatch) to main; PR runs never produce artifacts.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # vsce triggers the `vscode:prepublish` hook, which runs
      # check-types + lint + esbuild --production.
      - name: Package extension
        run: npx --no-install @vscode/vsce package --no-dependencies

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdscript-test-runner-vsix
          path: '*.vsix'
          if-no-files-found: error
